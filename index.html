<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GS Burak | Sistema de Control</title>
    <style>
:root {
  --bg: #f5f7f8;
  --panel: #ffffff;
  --ink: #17202a;
  --muted: #667085;
  --line: #d9e0e6;
  --brand: #0f766e;
  --brand-dark: #115e59;
  --accent: #c2410c;
  --soft: #e8f3f1;
  --danger: #b42318;
  --good: #16703f;
  --shadow: 0 12px 30px rgba(15, 35, 45, 0.08);
  font-family: Inter, Segoe UI, Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  -webkit-text-size-adjust: 100%;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

.login-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  background:
    linear-gradient(120deg, rgba(8, 22, 32, 0.72), rgba(15, 118, 110, 0.34)),
    url("login-bg-gs-burak.png");
  background-size: cover;
  background-position: center center;
}

.login-copy {
  color: white;
  padding: 8vw;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.login-copy h1 {
  font-size: clamp(34px, 5vw, 68px);
  line-height: 1;
  margin: 0 0 18px;
  max-width: 700px;
}

.login-copy p {
  max-width: 560px;
  font-size: 18px;
  line-height: 1.55;
  margin: 0;
}

.login-card {
  align-self: center;
  justify-self: center;
  width: min(420px, calc(100vw - 32px));
  background: rgba(255, 255, 255, 0.96);
  border-radius: 8px;
  padding: 28px;
  box-shadow: var(--shadow);
}

.login-card h2 {
  margin: 0 0 4px;
}

.login-card small {
  color: var(--muted);
}

.field {
  display: grid;
  gap: 7px;
  margin-top: 14px;
}

label {
  color: #344054;
  font-size: 13px;
  font-weight: 700;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 11px 12px;
  background: white;
  color: var(--ink);
  font-size: 16px;
}

textarea {
  min-height: 76px;
  resize: vertical;
}

.primary {
  background: var(--brand);
  color: white;
  border-radius: 6px;
  padding: 11px 14px;
  font-weight: 800;
}

.primary:hover {
  background: var(--brand-dark);
}

.secondary {
  background: #eef4f4;
  color: var(--brand-dark);
  border-radius: 6px;
  padding: 10px 12px;
  font-weight: 800;
}

.ghost {
  background: transparent;
  color: var(--muted);
  padding: 8px 10px;
}

.hint {
  background: #f2f6f7;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 12px;
  margin-top: 18px;
  color: #475467;
  font-size: 13px;
  line-height: 1.45;
}

.shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 260px 1fr;
}

.sidebar {
  background: #14232c;
  color: white;
  padding: 18px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
}

.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px 4px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  overflow: hidden;
}

.brand-logo {
  width: 190px;
  max-width: 100%;
  max-height: 58px;
  height: auto;
  display: block;
  object-fit: contain;
  background: white;
  border-radius: 6px;
  padding: 7px;
}

.nav {
  display: grid;
  gap: 6px;
  margin-top: 18px;
}

.nav button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  background: transparent;
  color: #d5e0e5;
  padding: 11px 10px;
  border-radius: 6px;
}

.nav button span {
  display: none;
}

.nav button.active,
.nav button:hover {
  background: rgba(255, 255, 255, 0.12);
  color: white;
}

.user-box {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 18px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
  padding-top: 14px;
  color: #d5e0e5;
}

.user-box strong,
.user-box span {
  display: block;
}

.user-box span {
  color: #a7b8c1;
  font-size: 12px;
}

.main {
  min-width: 0;
  padding: 22px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.topbar h1 {
  margin: 0;
  font-size: 27px;
}

.topbar p {
  margin: 5px 0 0;
  color: var(--muted);
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.compact-filter {
  min-width: 160px;
  margin-top: 0;
}

.grid {
  display: grid;
  gap: 14px;
}

.kpis {
  grid-template-columns: repeat(4, minmax(160px, 1fr));
}

.kpi,
.panel,
.table-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.kpi {
  padding: 16px;
}

.kpi span {
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}

.kpi strong {
  display: block;
  margin-top: 8px;
  font-size: 25px;
}

.kpi small {
  color: var(--muted);
}

.panel {
  padding: 16px;
}

.panel h2 {
  margin: 0 0 12px;
  font-size: 18px;
}

.two {
  grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
}

.bars {
  display: grid;
  gap: 10px;
}

.bar-row {
  display: grid;
  grid-template-columns: 72px 1fr 110px;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}

.bar-track {
  height: 12px;
  background: #edf2f4;
  border-radius: 999px;
  overflow: hidden;
}

.bar {
  height: 100%;
  background: var(--brand);
}

.table-card {
  overflow: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 820px;
}

th,
td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
  font-size: 13px;
}

th {
  background: #f1f5f6;
  color: #344054;
  font-size: 12px;
  text-transform: uppercase;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.pill {
  display: inline-flex;
  border-radius: 999px;
  padding: 4px 8px;
  font-size: 12px;
  font-weight: 800;
  background: #eef4f4;
  color: var(--brand-dark);
}

.pill.pending {
  background: #fff1e7;
  color: var(--accent);
}

.pill.good {
  background: #eaf6ee;
  color: var(--good);
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(180px, 1fr));
  gap: 12px;
}

.form-grid .wide {
  grid-column: span 2;
}

.form-grid .full {
  grid-column: 1 / -1;
}

.form-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 16px;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(12, 20, 26, 0.55);
  display: grid;
  place-items: center;
  padding: 18px;
  z-index: 20;
}

.modal {
  width: min(960px, 100%);
  max-height: 90vh;
  overflow: auto;
  background: white;
  border-radius: 8px;
  padding: 18px;
  box-shadow: var(--shadow);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 12px;
  margin-bottom: 8px;
}

.modal-header h2 {
  margin: 0;
}

.mobile-menu {
  display: none;
}

.readonly {
  opacity: 0.72;
}

.notice {
  background: var(--soft);
  border: 1px solid #cce2dd;
  border-radius: 8px;
  padding: 12px 14px;
  color: #285b55;
  margin-bottom: 14px;
}

.filters {
  display: grid;
  grid-template-columns: minmax(240px, 1fr) minmax(180px, 240px) auto;
  gap: 12px;
  align-items: end;
  margin-bottom: 14px;
}

.filters .field {
  margin-top: 0;
}

.filter-count {
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
  padding: 11px 0;
  white-space: nowrap;
}

.lotes-panel {
  margin-top: 14px;
}

.lot-group {
  border-top: 1px solid var(--line);
  padding-top: 12px;
  margin-top: 12px;
}

.lot-group h3 {
  margin: 0 0 10px;
  font-size: 16px;
}

@media (max-width: 920px) {
  .login-shell {
    grid-template-columns: 1fr;
  }

  .login-copy {
    padding: 38px 20px 14px;
  }

  .login-copy h1 {
    font-size: 36px;
  }

  .login-copy p {
    font-size: 16px;
  }

  .login-card {
    margin: 0 16px 24px;
    width: auto;
    justify-self: stretch;
  }

  .shell {
    grid-template-columns: 1fr;
  }

  .sidebar {
    position: static;
    height: auto;
    padding: 10px;
  }

  .brand {
    padding: 6px 6px 10px;
  }

  .brand-logo {
    width: 170px;
    max-height: 52px;
    padding: 6px;
  }

  .nav {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    margin-top: 10px;
    overflow: visible;
    padding: 0;
  }

  .nav button {
    min-width: 0;
    justify-content: center;
    min-height: 44px;
    padding: 10px 12px;
    white-space: normal;
    line-height: 1.2;
  }

  .user-box {
    position: static;
    margin-top: 6px;
    padding: 10px 6px 0;
  }

  .main {
    padding: 14px 12px 22px;
  }

  .topbar {
    align-items: stretch;
    flex-direction: column;
    gap: 10px;
  }

  .topbar h1 {
    font-size: 25px;
  }

  .toolbar {
    width: 100%;
  }

  .toolbar button {
    flex: 1 1 180px;
    min-height: 44px;
  }

  .kpis,
  .two,
  .form-grid,
  .filters {
    grid-template-columns: 1fr;
  }

  .filter-count {
    padding: 2px 0 0;
  }

  .form-grid .wide,
  .form-grid .full {
    grid-column: auto;
  }

  .bar-row {
    grid-template-columns: 58px 1fr;
  }

  .bar-row strong {
    grid-column: 2;
  }

  .table-card {
    max-width: calc(100vw - 24px);
    overflow: visible;
  }

  .table-card table,
  .table-card thead,
  .table-card tbody,
  .table-card th,
  .table-card td,
  .table-card tr {
    display: block;
    width: 100%;
    min-width: 0;
  }

  .table-card table {
    min-width: 0;
  }

  .table-card thead {
    display: none;
  }

  .table-card tbody {
    display: grid;
    gap: 10px;
  }

  .table-card tr {
    background: white;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }

  .table-card td {
    display: grid;
    grid-template-columns: minmax(95px, 38%) 1fr;
    gap: 10px;
    align-items: start;
    min-height: 40px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
    word-break: break-word;
  }

  .table-card td:last-child {
    border-bottom: 0;
  }

  .table-card td::before {
    content: attr(data-label);
    color: var(--muted);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
  }

  .service-list tr {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .service-list td {
    display: block;
    min-height: 0;
    padding: 9px 12px;
  }

  .service-list td::before {
    display: block;
    margin-bottom: 4px;
  }

  .service-list td[data-label="Cliente"],
  .service-list td[data-label="Servicio"],
  .service-list td[data-label="Acciones"] {
    grid-column: 1 / -1;
  }

  .service-list .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .modal-backdrop {
    align-items: stretch;
    padding: 8px;
  }

  .modal {
    width: 100%;
    max-height: calc(100vh - 16px);
    padding: 16px;
  }

  .form-actions {
    position: sticky;
    bottom: -16px;
    background: white;
    border-top: 1px solid var(--line);
    margin: 16px -16px -16px;
    padding: 12px 16px;
  }

  .form-actions button {
    flex: 1;
    min-height: 44px;
  }
}

@media (max-width: 560px) {
  .login-shell {
    min-height: 100svh;
  }

  .login-copy {
    min-height: 34svh;
  }

  .shell {
    min-height: 100svh;
  }

  .brand {
    border-bottom: 0;
    justify-content: flex-start;
  }

  .nav {
    grid-template-columns: 1fr 1fr;
  }

  .brand-logo {
    width: 145px;
    max-height: 46px;
  }

  .user-box {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 6px 10px;
  }

  .user-box span {
    grid-column: 1;
  }

  .user-box .ghost {
    grid-column: 2;
    grid-row: 1 / span 2;
    justify-self: end;
  }

  .topbar h1 {
    font-size: 23px;
  }

  .topbar p {
    font-size: 14px;
    line-height: 1.4;
  }

  .kpi {
    padding: 14px;
  }

  .kpi strong {
    font-size: 23px;
  }

  .panel {
    padding: 14px;
  }

  .actions {
    min-width: 0;
    justify-content: stretch;
  }

  .actions button {
    flex: 1 1 100px;
    min-height: 40px;
  }

  .modal-header h2 {
    font-size: 22px;
  }

  .form-grid .panel {
    padding: 12px;
  }
}

    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js?v=20260604a"></script>
  </body>
</html>
